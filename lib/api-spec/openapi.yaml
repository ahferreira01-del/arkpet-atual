openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Pet Daycare SaaS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: creches
    description: Creche (pet daycare) management
  - name: pets
    description: Pet profile management
  - name: bookings
    description: Booking and reservations
  - name: tasks
    description: Staff task management
  - name: timeline
    description: Pet timeline and media
  - name: chat
    description: Internal messaging
  - name: users
    description: User management
  - name: medical
    description: Medical records
  - name: walks
    description: Walk tracking
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/register-creche:
    post:
      operationId: registerCreche
      tags: [auth]
      summary: Self-service creche registration (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCrecheRequest"
      responses:
        "201":
          description: Creche registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
        "409":
          description: Email already registered

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset link (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Always returns 200 to avoid e-mail enumeration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using a valid token (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid/expired token or validation error

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out

  /creches:
    get:
      operationId: listCreches
      tags: [creches]
      summary: List all creches (master admin only)
      responses:
        "200":
          description: List of creches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Creche"
    post:
      operationId: createCreche
      tags: [creches]
      summary: Create a new creche
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCrecheRequest"
      responses:
        "201":
          description: Creche created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Creche"

  /creches/{crecheId}:
    get:
      operationId: getCreche
      tags: [creches]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
      summary: Get creche details
      responses:
        "200":
          description: Creche details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Creche"
    put:
      operationId: updateCreche
      tags: [creches]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
      summary: Update creche
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCrecheRequest"
      responses:
        "200":
          description: Creche updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Creche"

  /creches/{crecheId}/stats:
    get:
      operationId: getCrecheStats
      tags: [creches]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
      summary: Get creche operational stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrecheStats"

  /creches/{crecheId}/staff:
    get:
      operationId: listCrecheStaff
      tags: [creches]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
      summary: List staff members of a creche
      responses:
        "200":
          description: Staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"
    post:
      operationId: addStaffMember
      tags: [creches]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
      summary: Add staff member to creche
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddStaffRequest"
      responses:
        "201":
          description: Staff member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /creches/{crecheId}/pets:
    get:
      operationId: listPets
      tags: [pets]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, checked_in, all]
        - name: tutorId
          in: query
          schema:
            type: string
      summary: List pets for a creche
      responses:
        "200":
          description: List of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      operationId: createPet
      tags: [pets]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
      summary: Register a new pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePetRequest"
      responses:
        "201":
          description: Pet created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"

  /creches/{crecheId}/pets/{petId}:
    get:
      operationId: getPet
      tags: [pets]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - $ref: "#/components/parameters/PetId"
      summary: Get pet profile
      responses:
        "200":
          description: Pet profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
    put:
      operationId: updatePet
      tags: [pets]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - $ref: "#/components/parameters/PetId"
      summary: Update pet profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePetRequest"
      responses:
        "200":
          description: Updated pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"

  /creches/{crecheId}/pets/{petId}/vaccines:
    get:
      operationId: listVaccines
      tags: [medical]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - $ref: "#/components/parameters/PetId"
      summary: List pet vaccines
      responses:
        "200":
          description: Vaccines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vaccine"
    post:
      operationId: addVaccine
      tags: [medical]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - $ref: "#/components/parameters/PetId"
      summary: Add vaccine record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVaccineRequest"
      responses:
        "201":
          description: Vaccine added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vaccine"

  /creches/{crecheId}/pets/{petId}/medications:
    get:
      operationId: listMedications
      tags: [medical]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - $ref: "#/components/parameters/PetId"
      summary: List pet medications
      responses:
        "200":
          description: Medications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Medication"
    post:
      operationId: addMedication
      tags: [medical]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - $ref: "#/components/parameters/PetId"
      summary: Add medication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMedicationRequest"
      responses:
        "201":
          description: Medication added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medication"

  /creches/{crecheId}/pets/{petId}/medications/{medicationId}/administer:
    post:
      operationId: administerMedication
      tags: [medical]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - $ref: "#/components/parameters/PetId"
        - name: medicationId
          in: path
          required: true
          schema:
            type: integer
      summary: Confirm medication administered
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdministerMedicationRequest"
      responses:
        "200":
          description: Medication administered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medication"

  /creches/{crecheId}/bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, active, completed, cancelled]
        - name: type
          in: query
          schema:
            type: string
            enum: [day_use, lodging]
        - name: date
          in: query
          schema:
            type: string
            format: date
      summary: List bookings
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
      summary: Create booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /creches/{crecheId}/bookings/{bookingId}:
    get:
      operationId: getBooking
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - $ref: "#/components/parameters/BookingId"
      summary: Get booking details
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
    put:
      operationId: updateBooking
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - $ref: "#/components/parameters/BookingId"
      summary: Update booking status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingRequest"
      responses:
        "200":
          description: Booking updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /creches/{crecheId}/bookings/{bookingId}/checkin:
    post:
      operationId: checkIn
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - $ref: "#/components/parameters/BookingId"
      summary: Check in a pet
      responses:
        "200":
          description: Checked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /creches/{crecheId}/bookings/{bookingId}/checkout:
    post:
      operationId: checkOut
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - $ref: "#/components/parameters/BookingId"
      summary: Check out a pet
      responses:
        "200":
          description: Checked out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /creches/{crecheId}/tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: assignedTo
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, completed, skipped]
      summary: List tasks
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
      summary: Create task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /creches/{crecheId}/tasks/{taskId}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      summary: Mark task as complete
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteTaskRequest"
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /creches/{crecheId}/pets/{petId}/timeline:
    get:
      operationId: listTimeline
      tags: [timeline]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - $ref: "#/components/parameters/PetId"
        - name: date
          in: query
          schema:
            type: string
            format: date
      summary: Get pet timeline
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEvent"
    post:
      operationId: addTimelineEvent
      tags: [timeline]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - $ref: "#/components/parameters/PetId"
      summary: Add timeline event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTimelineEventRequest"
      responses:
        "201":
          description: Event added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineEvent"

  /creches/{crecheId}/pets/{petId}/walks:
    get:
      operationId: listWalks
      tags: [walks]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - $ref: "#/components/parameters/PetId"
        - name: date
          in: query
          schema:
            type: string
            format: date
      summary: List pet walks
      responses:
        "200":
          description: Walks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Walk"
    post:
      operationId: startWalk
      tags: [walks]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - $ref: "#/components/parameters/PetId"
      summary: Start a walk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartWalkRequest"
      responses:
        "201":
          description: Walk started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Walk"

  /creches/{crecheId}/pets/{petId}/walks/{walkId}/end:
    post:
      operationId: endWalk
      tags: [walks]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - $ref: "#/components/parameters/PetId"
        - name: walkId
          in: path
          required: true
          schema:
            type: integer
      summary: End a walk
      responses:
        "200":
          description: Walk ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Walk"

  /creches/{crecheId}/chat/conversations:
    get:
      operationId: listConversations
      tags: [chat]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
      summary: List chat conversations (one per tutor)
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatConversation"

  /creches/{crecheId}/chat:
    get:
      operationId: listMessages
      tags: [chat]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
        - name: tutorId
          in: query
          schema:
            type: integer
        - name: cursor
          in: query
          description: Last message id for pagination (load older messages)
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      summary: List chat messages
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendMessage
      tags: [chat]
      parameters:
        - $ref: "#/components/parameters/CrecheId"
      summary: Send chat message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (master admin only)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      summary: Get user profile
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    put:
      operationId: updateUser
      tags: [users]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

components:
  parameters:
    CrecheId:
      name: crecheId
      in: path
      required: true
      schema:
        type: integer
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: integer
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: integer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum: [master_admin, creche_admin, staff, tutor]
        crecheId:
          type: integer
          nullable: true
      required: [name, email, password, role]

    RegisterCrecheRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        crecheName:
          type: string
        crechePhone:
          type: string
          nullable: true
        crecheAddress:
          type: string
          nullable: true
      required: [name, email, password, crecheName]

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
      required: [token, password]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        token:
          type: string
      required: [user, token]

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [master_admin, creche_admin, staff, tutor]
        crecheId:
          type: integer
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, role, createdAt]

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        avatarUrl:
          type: string
          nullable: true

    Creche:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        maxCapacity:
          type: integer
        currentOccupancy:
          type: integer
        logoUrl:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, inactive]
        adminId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, name, address, phone, email, maxCapacity, currentOccupancy, status, createdAt]

    CreateCrecheRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        maxCapacity:
          type: integer
        adminEmail:
          type: string
          nullable: true
      required: [name, address, phone, email, maxCapacity]

    UpdateCrecheRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
