<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>
  <!-- Soft glow -->
  <circle cx="256" cy="220" r="160" fill="#8b5cf6" opacity="0.08"/>
  <!-- Dog paw icon -->
  <!-- Main pad -->
  <ellipse cx="256" cy="295" rx="68" ry="60" fill="url(#accent)" filter="url(#glow)"/>
  <!-- Toe pads -->
  <ellipse cx="190" cy="228" rx="32" ry="28" fill="url(#accent)"/>
  <ellipse cx="256" cy="208" rx="32" ry="28" fill="url(#accent)"/>
  <ellipse cx="322" cy="228" rx="32" ry="28" fill="url(#accent)"/>
  <!-- Inner lighter detail -->
  <ellipse cx="256" cy="295" rx="42" ry="36" fill="#c4b5fd" opacity="0.3"/>
  <!-- Star/sparkle -->
  <circle cx="370" cy="150" r="5" fill="#a855f7" opacity="0.7"/>
  <circle cx="145" cy="175" r="4" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="390" cy="300" r="3" fill="#c4b5fd" opacity="0.4"/>
</svg>
