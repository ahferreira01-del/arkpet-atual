kind = "web"
previewPath = "/"
title = "Pet Daycare SaaS"
version = "1.0.0"
id = "artifacts/petdaycare"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 21324
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/petdaycare run dev"

[services.env]
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/petdaycare", "run", "build"]
run = ["pnpm", "--filter", "@workspace/petdaycare", "run", "start"]
