<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json" />

    <!-- App identity -->
    <title>ArkPet</title>
    <meta name="application-name" content="ArkPet" />
    <meta name="description" content="Plataforma de gestão para pet daycare. Reservas, pets e equipe em um só lugar." />

    <!-- Theme & splash -->
    <meta name="theme-color" content="#b91c1c" />

    <!-- Mobile Web App (Android + iOS) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ArkPet" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="./icons/arkpet-logo.png" />
    <link rel="apple-touch-icon" href="./icons/arkpet-logo.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
